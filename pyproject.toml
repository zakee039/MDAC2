[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "mdac2"
dynamic = ["version"]
description = "Local, explainable Muse Dash chart authoring core"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.4.2"]
analysis = ["librosa==0.11.0", "numpy==2.2.6", "scipy==1.15.3", "numba==0.61.2"]
evaluation = ["mir_eval==0.8.2", "numpy==2.2.6", "scipy==1.15.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "mdac2.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
